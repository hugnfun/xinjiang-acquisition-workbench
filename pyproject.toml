[project]
name = "workbench-sidecar"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "anthropic>=0.40",
    "openai>=1.50",
    "pydantic>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sidecar*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
# models.py 的 default=datetime.utcnow 是 brief 原文（verbatim），在 Py3.12+ 触发
# DeprecationWarning；保留模型代码不动，仅在测试运行层定向静默该条警告以保持输出纯净。
# api/*.py 同理沿用 brief 原文的 Query.get()（SQLAlchemy 1.x 风格，2.0 标记 legacy），
# 现代写法为 Session.get()；此处同样保留 verbatim，仅定向静默该条 legacy 警告。
filterwarnings = [
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
    "ignore:The Query.get\\(\\) method is considered legacy:sqlalchemy.exc.LegacyAPIWarning",
]
