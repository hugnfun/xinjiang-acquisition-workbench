[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pin time below 0.3.52: 0.3.52 changed Parsable::parse to require a `defaults`
# argument, a breaking change in a patch release that fails to compile the
# transitive `cookie 0.18.1` dep used by tauri/wry. Drop this pin once upstreams
# (cookie/tauri) ship versions compatible with time >= 0.3.52.
time = { version = "=0.3.51", default-features = false, features = ["std", "parsing", "formatting", "macros"] }

